name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Publishing a GitHub Release is the only way to ship. Its tag push deliberately does not trigger this
  # workflow: both events used to run the full matrix and race to push the same packages.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Suites that must have run (and passed at least this many tests) in every integration job; see
  # .github/scripts/check-suites-ran.sh. Managed is added per job because its count depends on the server.
  # Auth is the whole suite (password, ACL, mTLS, cluster and Sentinel with auth; containers from auth-up.sh):
  # none of it is gated on the image, so a test that stops running is a regression in coverage.
  RNC_REQUIRED_SUITES: Core=1 Chaos=1 EdgeCases=1 Compat=1 Resilience=1 HybridCache=1 Sentinel=4 Broadcast=1 Auth=23

jobs:
  unit:
    name: unit tests (no Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Unit tests (net8.0 and net10.0)
        run: dotnet test tests/RedisNearCache.UnitTests -c Release --no-build -nologo --logger "trx;LogFileName=unit.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/RedisNearCache.UnitTests/TestResults/*.trx

  integration:
    # The job names are the required status checks in the "Require tests on main" ruleset; renaming a job
    # means updating the ruleset in the same change, or every PR waits forever for a check that never reports.
    name: integration tests (Redis, replica, cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start Redis 7.4 (standalone, replica, TLS, cluster, Sentinel, restricted, hostname cluster, auth/ACL/mTLS)
        run: ./up.sh
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Integration, chaos, edge-case, compat, resilience, Sentinel and managed-style tests
        run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category!=Soak" --logger "trx;LogFileName=integration.trx"
      - name: Check every suite ran
        if: always()
        run: .github/scripts/check-suites-ran.sh tests/RedisNearCache.Tests/TestResults/integration.trx ${{ env.RNC_REQUIRED_SUITES }} Managed=3
      - name: Container logs
        if: failure()
        run: .github/scripts/dump-container-logs.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/RedisNearCache.Tests/TestResults/*.trx

  matrix:
    name: integration on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:6.2", "redis:7.0", "redis:7.2", "redis:8", "valkey/valkey:8.1"]
    env:
      RNC_REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start ${{ matrix.image }} (standalone, replica, TLS, cluster, Sentinel, managed-style, auth/ACL/mTLS)
        run: ./up.sh
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Integration tests against ${{ matrix.image }}
        run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category!=Soak" --logger "trx;LogFileName=integration-${{ strategy.job-index }}.trx"
      # Managed=1: the hostname-announcing cluster needs Redis 7.0+, so on redis:6.2 only the restricted-commands test runs.
      - name: Check every suite ran
        if: always()
        run: .github/scripts/check-suites-ran.sh tests/RedisNearCache.Tests/TestResults/integration-${{ strategy.job-index }}.trx ${{ env.RNC_REQUIRED_SUITES }} Managed=1
      - name: Container logs
        if: failure()
        run: .github/scripts/dump-container-logs.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ strategy.job-index }}
          path: tests/RedisNearCache.Tests/TestResults/*.trx

  enterprise:
    # Broadcast tracking mode against the real Redis Enterprise proxy: enterprise-up.sh runs Redis Software
    # (dev/test licence) in Docker, the same proxy that fronts Azure Managed Redis and Redis Cloud.
    name: integration on Redis Enterprise (Redis Software in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start single-node Redis Software behind its proxy (:12000, and a password-protected database on :12001)
        run: ./enterprise-up.sh
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Broadcast-mode tests against the Enterprise proxy
        env:
          RNC_ENTERPRISE_REDIS: localhost:12000
          RNC_ENTERPRISE_AUTH_REDIS: localhost:12001
        run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "FullyQualifiedName~RedisNearCache.Tests.Enterprise" --logger "trx;LogFileName=enterprise.trx"
      - name: Check the suite ran
        if: always()
        run: .github/scripts/check-suites-ran.sh tests/RedisNearCache.Tests/TestResults/enterprise.trx Enterprise=9
      - name: Container logs
        if: failure()
        run: docker logs --tail 200 redis-near-cache-enterprise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-test-results
          path: tests/RedisNearCache.Tests/TestResults/*.trx

  soak:
    name: soak tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: ./up.sh
      - run: dotnet build -c Release -nologo
      - run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category=Soak"

  pack:
    name: pack
    # A release must pass on every supported server, not only Redis 7.4. The Enterprise job runs on every push and
    # pull request too, but does not gate packaging: it depends on a third-party licensed image whose pull or
    # bootstrap can fail for reasons unrelated to this library.
    needs: [unit, integration, matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Resolve version
        id: version
        run: |
          base=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          if [[ "${GITHUB_EVENT_NAME}" == release ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            # A release whose tag disagrees with the committed version is a mistake (e.g. the bump never merged).
            if [[ "$tag" != "$base" ]]; then
              echo "::error::release tag v${tag} does not match <Version>${base}</Version> in Directory.Build.props at ${GITHUB_SHA}"
              exit 1
            fi
            echo "value=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        run: |
          dotnet pack src/RedisNearCache/RedisNearCache.csproj -c Release -nologo -o artifacts -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          dotnet pack src/RedisNearCache.HybridCache/RedisNearCache.HybridCache.csproj -c Release -nologo -o artifacts -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          # The symbol packages ride along: `dotnet nuget push x.nupkg` also pushes the x.snupkg beside it.
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    name: publish to NuGet
    # A published GitHub Release only (its tag is vX.Y.Z and must match <Version>; see pack). Uses nuget.org
    # Trusted Publishing: the job's OIDC token is exchanged for a short-lived API key, so no long-lived secret
    # is stored. The trust policy on nuget.org must name this repository and this workflow file (ci.yml).
    if: github.event_name == 'release'
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: magnanz
      - name: Push packages
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Attach packages to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.nupkg --repo "${{ github.repository }}" --clobber
