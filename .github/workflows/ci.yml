name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (no Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Unit tests (net8.0 and net10.0)
        run: dotnet test tests/RedisNearCache.UnitTests -c Release --no-build -nologo --logger "trx;LogFileName=unit.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/RedisNearCache.UnitTests/TestResults/*.trx

  integration:
    name: integration tests (Redis, replica, cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start Redis 7.4 (standalone, replica, TLS) and the 6-node cluster
        run: ./up.sh
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Integration, chaos, edge-case, compat and resilience tests
        run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category!=Soak" --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/RedisNearCache.Tests/TestResults/*.trx

  matrix:
    name: integration on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["redis:6.2", "redis:7.0", "redis:7.2", "redis:8", "valkey/valkey:8.1"]
    env:
      RNC_REDIS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start ${{ matrix.image }} (standalone, replica, TLS, cluster)
        run: ./up.sh
      - name: Build
        run: dotnet build -c Release -nologo
      - name: Integration tests against ${{ matrix.image }}
        run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category!=Soak" --logger "trx;LogFileName=integration-${{ strategy.job-index }}.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ strategy.job-index }}
          path: tests/RedisNearCache.Tests/TestResults/*.trx

  soak:
    name: soak tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: ./up.sh
      - run: dotnet build -c Release -nologo
      - run: dotnet test tests/RedisNearCache.Tests -c Release --no-build -nologo --filter "Category=Soak"

  pack:
    name: pack
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
            echo "value=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        run: |
          dotnet pack src/RedisNearCache/RedisNearCache.csproj -c Release -nologo -o artifacts -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          dotnet pack src/RedisNearCache.HybridCache/RedisNearCache.HybridCache.csproj -c Release -nologo -o artifacts -p:Version=${{ steps.version.outputs.value }} -p:ContinuousIntegrationBuild=true
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  publish:
    name: publish to NuGet
    # A published GitHub Release (its tag is vX.Y.Z) or a pushed v* tag. Uses nuget.org Trusted Publishing:
    # the job's OIDC token is exchanged for a short-lived API key, so no long-lived secret is stored.
    # The trust policy on nuget.org must name this repository and this workflow file (ci.yml).
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: magnanz
      - name: Push packages
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Attach packages to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.nupkg --repo "${{ github.repository }}" --clobber
