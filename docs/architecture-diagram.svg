<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Your code reads through RedisNearCache, which serves from L1 or reads over a private tracked connection; Redis pushes invalidations to a private subscriber connection which evicts from L1; your own multiplexer and any other writer send writes to Redis directly.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E5470"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <style>
      .t { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1B2431; font-size: 13px; }
      .b { font-weight: 600; }
      .m { fill: #5B6B7F; font-size: 12px; }
      .code { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #1B2431; }
      .lbl { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #3E5470; paint-order: stroke; stroke: #F6F7F9; stroke-width: 6px; stroke-linejoin: round; }
      .lbl-red { fill: #C0392B; }
      .box { fill: #FFFFFF; stroke: #C9D1DB; stroke-width: 1.5; }
      .flow { stroke: #3E5470; stroke-width: 1.8; fill: none; }
      .red { stroke: #C0392B; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <!-- card background so the figure reads on light and dark pages alike -->
  <rect x="0" y="0" width="1000" height="480" rx="12" fill="#F6F7F9"/>

  <!-- process boundary -->
  <rect x="24" y="24" width="640" height="420" rx="10" fill="none" stroke="#9AA7B6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="40" y="48" class="t m" style="letter-spacing:0.08em">YOUR PROCESS</text>

  <!-- your code -->
  <rect x="48" y="96" width="150" height="52" rx="6" class="box"/>
  <text x="123" y="127" class="t b" text-anchor="middle">Your code</text>

  <!-- facade -->
  <rect x="250" y="76" width="250" height="160" rx="8" class="box"/>
  <text x="375" y="102" class="t b" text-anchor="middle">IRedisNearCache</text>
  <rect x="270" y="118" width="210" height="42" rx="6" fill="#E6F4F1" stroke="#1F7A6D" stroke-width="1.5"/>
  <text x="375" y="144" class="t b" text-anchor="middle" fill="#1F7A6D">L1 · MemoryCache</text>
  <rect x="270" y="172" width="210" height="42" rx="6" class="box"/>
  <text x="375" y="198" class="t" text-anchor="middle">in-flight tracker</text>

  <!-- private multiplexer -->
  <rect x="250" y="272" width="250" height="160" rx="8" class="box"/>
  <text x="375" y="296" class="t b" text-anchor="middle">Private multiplexer</text>
  <text x="375" y="314" class="t m" text-anchor="middle">RESP2 · admin · own client name</text>
  <rect x="270" y="330" width="210" height="40" rx="6" class="box"/>
  <text x="375" y="354" class="t" text-anchor="middle">interactive · tracked reads</text>
  <rect x="270" y="380" width="210" height="40" rx="6" fill="#FBEAE7" stroke="#C0392B" stroke-width="1.5"/>
  <text x="375" y="404" class="t b" text-anchor="middle" fill="#C0392B">subscriber · redirect target</text>

  <!-- your multiplexer -->
  <rect x="48" y="330" width="150" height="64" rx="6" class="box"/>
  <text x="123" y="356" class="t b" text-anchor="middle">Your multiplexer</text>
  <text x="123" y="376" class="t m" text-anchor="middle">untouched</text>

  <!-- redis -->
  <rect x="760" y="272" width="210" height="160" rx="8" fill="#FFFFFF" stroke="#3E5470" stroke-width="2"/>
  <text x="865" y="298" class="t b" text-anchor="middle">Redis 6+ / Valkey</text>
  <text x="865" y="326" class="t m" text-anchor="middle">tracking table</text>
  <text x="865" y="344" class="t" text-anchor="middle">key → client ids</text>
  <text x="865" y="382" class="code" text-anchor="middle">CLIENT TRACKING ON</text>
  <text x="865" y="400" class="code" text-anchor="middle">REDIRECT &lt;sub id&gt; NOLOOP</text>

  <!-- other writers -->
  <rect x="760" y="96" width="210" height="64" rx="6" class="box"/>
  <text x="865" y="122" class="t b" text-anchor="middle">Other writers</text>
  <text x="865" y="144" class="t m" text-anchor="middle">redis-cli · Java · Go · Lua</text>

  <!-- flows -->
  <line x1="198" y1="122" x2="248" y2="122" class="flow" marker-end="url(#arrow)"/>
  <text x="223" y="113" class="lbl" text-anchor="middle">GetAsync</text>

  <line x1="375" y1="236" x2="375" y2="270" class="flow" marker-end="url(#arrow)"/>
  <text x="386" y="258" class="lbl">GET on miss</text>

  <line x1="480" y1="350" x2="758" y2="350" class="flow" marker-end="url(#arrow)"/>
  <text x="619" y="342" class="lbl" text-anchor="middle">GET key · server tracks it</text>

  <line x1="758" y1="400" x2="482" y2="400" class="red" marker-end="url(#arrow-red)"/>
  <text x="619" y="419" class="lbl lbl-red" text-anchor="middle">invalidate [key]</text>

  <path d="M270 400 L232 400 L232 139 L268 139" class="red" marker-end="url(#arrow-red)"/>
  <text x="224" y="273" class="lbl lbl-red" text-anchor="end">evict</text>

  <path d="M123 394 L123 452 L865 452 L865 436" class="flow" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="494" y="470" class="lbl" text-anchor="middle">writes from your multiplexer go straight to Redis and invalidate like any other writer</text>

  <line x1="865" y1="160" x2="865" y2="270" class="flow" marker-end="url(#arrow)"/>
  <text x="874" y="218" class="lbl">SET key</text>
</svg>
