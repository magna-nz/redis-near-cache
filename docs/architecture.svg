<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" style="color:#1B2431;font-family:ui-monospace,Menlo,monospace" role="img" aria-label="Architecture: your code calls IRedisNearCache, which serves from L1 or reads over the private interactive connection; Redis sends invalidations to the private subscriber connection which evicts from L1; your own multiplexer and any other writer send writes to Redis directly.">
        <defs>
          <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          <marker id="a2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
          <marker id="a2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A6D"/></marker>
        </defs>
        <g font-family="JetBrains Mono, monospace" font-size="12" fill="currentColor">
          <!-- app boundary -->
          <rect x="20" y="20" width="560" height="360" rx="6" fill="none" stroke="#D3D9E1" stroke-dasharray="6 4"/>
          <text x="34" y="42" fill="#5B6B7F" font-size="11">YOUR PROCESS</text>
          <!-- your code -->
          <rect x="40" y="70" width="130" height="44" rx="3" fill="none" stroke="currentColor"/>
          <text x="105" y="97" text-anchor="middle">Your code</text>
          <!-- facade -->
          <rect x="220" y="60" width="200" height="130" rx="3" fill="none" stroke="currentColor"/>
          <text x="320" y="82" text-anchor="middle" font-weight="500">IRedisNearCache</text>
          <rect x="240" y="98" width="160" height="34" rx="3" fill="none" stroke="#1F7A6D"/>
          <text x="320" y="120" text-anchor="middle" fill="#1F7A6D">L1  MemoryCache</text>
          <rect x="240" y="142" width="160" height="34" rx="3" fill="none" stroke="currentColor"/>
          <text x="320" y="164" text-anchor="middle">in-flight set</text>
          <!-- private mux -->
          <rect x="220" y="220" width="200" height="120" rx="3" fill="none" stroke="currentColor"/>
          <text x="320" y="242" text-anchor="middle" font-weight="500">private multiplexer</text>
          <text x="320" y="258" text-anchor="middle" font-size="11" fill="#5B6B7F">RESP2 · allowAdmin · own name</text>
          <rect x="240" y="270" width="160" height="26" rx="3" fill="none" stroke="currentColor"/>
          <text x="320" y="288" text-anchor="middle" font-size="11">interactive conn (tracked)</text>
          <rect x="240" y="304" width="160" height="26" rx="3" fill="none" stroke="#C0392B"/>
          <text x="320" y="322" text-anchor="middle" font-size="11" fill="#C0392B">subscriber conn (redirect)</text>
          <!-- your mux -->
          <rect x="40" y="260" width="130" height="60" rx="3" fill="none" stroke="currentColor"/>
          <text x="105" y="285" text-anchor="middle">Your multiplexer</text>
          <text x="105" y="303" text-anchor="middle" font-size="11" fill="#5B6B7F">untouched</text>
          <!-- redis -->
          <rect x="700" y="200" width="170" height="140" rx="3" fill="none" stroke="currentColor"/>
          <text x="785" y="224" text-anchor="middle" font-weight="500">Redis 6+ / Valkey</text>
          <text x="785" y="246" text-anchor="middle" font-size="11" fill="#5B6B7F">tracking table:</text>
          <text x="785" y="262" text-anchor="middle" font-size="11" fill="#5B6B7F">key → client ids</text>
          <text x="785" y="292" text-anchor="middle" font-size="11">CLIENT TRACKING ON</text>
          <text x="785" y="308" text-anchor="middle" font-size="11">REDIRECT &lt;sub id&gt;</text>
          <!-- other writers -->
          <rect x="700" y="60" width="170" height="60" rx="3" fill="none" stroke="currentColor"/>
          <text x="785" y="84" text-anchor="middle">Other writers</text>
          <text x="785" y="102" text-anchor="middle" font-size="11" fill="#5B6B7F">redis-cli, Java, Go, Lua</text>
          <!-- arrows -->
          <line x1="170" y1="92" x2="218" y2="92" stroke="currentColor" marker-end="url(#a2)"/>
          <text x="194" y="84" text-anchor="middle" font-size="11">GetAsync</text>
          <line x1="320" y1="190" x2="320" y2="218" stroke="currentColor" marker-end="url(#a2)"/>
          <text x="330" y="208" font-size="11">GET on miss</text>
          <line x1="400" y1="283" x2="698" y2="283" stroke="currentColor" marker-end="url(#a2)"/>
          <text x="549" y="276" text-anchor="middle" font-size="11">GET key  (server tracks it)</text>
          <line x1="698" y1="317" x2="402" y2="317" stroke="#C0392B" marker-end="url(#a2c)"/>
          <text x="549" y="332" text-anchor="middle" font-size="11" fill="#C0392B">message __redis__:invalidate [key]</text>
          <path d="M240 317 L200 317 L200 115 L238 115" fill="none" stroke="#C0392B" marker-end="url(#a2c)"/>
          <text x="196" y="230" text-anchor="end" font-size="11" fill="#C0392B">evict</text>
          <line x1="170" y1="290" x2="698" y2="290" stroke="currentColor" stroke-dasharray="4 3"/>
          <text x="440" y="356" text-anchor="middle" font-size="11" fill="#5B6B7F">writes from your multiplexer (dashed) go straight to Redis; they invalidate like any other writer</text>
          <line x1="785" y1="120" x2="785" y2="198" stroke="currentColor" marker-end="url(#a2)"/>
          <text x="795" y="162" font-size="11">SET key</text>
        </g>
      </svg>
