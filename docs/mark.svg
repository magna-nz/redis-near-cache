<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="RedisNearCache mark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E5470"/>
      <stop offset="1" stop-color="#1B2431"/>
    </linearGradient>
    <mask id="m">
      <rect width="104" height="104" fill="#fff"/>
      <rect x="19" y="31" width="40" height="58" rx="8" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="96" height="96" rx="22" fill="url(#g)"/>
  <!-- redis, mirrored behind the local copy -->
  <g mask="url(#m)">
    <rect x="46" y="18" width="34" height="54" rx="6" fill="none" stroke="#E6E9EE" stroke-width="4"/>
    <line x1="54" y1="32" x2="72" y2="32" stroke="#E6E9EE" stroke-width="4" stroke-linecap="round"/>
    <line x1="54" y1="45" x2="72" y2="45" stroke="#E6E9EE" stroke-width="4" stroke-linecap="round"/>
    <line x1="54" y1="58" x2="72" y2="58" stroke="#E6E9EE" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- local mirror in front; one row just went stale -->
  <rect x="22" y="34" width="34" height="54" rx="6" fill="none" stroke="#4FB8A6" stroke-width="4"/>
  <line x1="30" y1="48" x2="48" y2="48" stroke="#4FB8A6" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="61" x2="48" y2="61" stroke="#E2604F" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="74" x2="48" y2="74" stroke="#4FB8A6" stroke-width="4" stroke-linecap="round"/>
</svg>
